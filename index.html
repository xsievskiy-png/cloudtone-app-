HTML_CONTENT = """
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudTone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f0f13; --card: #1c1c24; --accent: #7b2cbf; --text: #ffffff; --muted: #8e8e9e; --green: #2ecc71; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; padding-bottom: 70px; }
        .balance-card { background: var(--card); border-radius: 15px; padding: 15px; margin: 15px; display: flex; justify-content: space-between; }
        .balance-value { font-size: 28px; font-weight: bold; }
        .balance-value span { font-size: 16px; color: var(--accent); }
        .fan-container { display: flex; justify-content: center; margin: 30px 0; }
        .fan { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #3c096c, #10002b); border: 4px solid #5a189a; display: flex; justify-content: center; align-items: center; animation: spin 3s linear infinite; box-shadow: 0 0 30px rgba(123, 44, 191, 0.5); }
        .fan.inactive { animation: none; opacity: 0.5; box-shadow: none; }
        .fan svg { width: 150px; height: 150px; fill: #9d4edd; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .status-text { text-align: center; font-size: 20px; font-weight: bold; }
        .status-sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 20px;}
        .btn { display: block; width: 80%; margin: 20px auto; padding: 15px; border-radius: 15px; border: none; background: var(--accent); color: white; font-size: 16px; font-weight: bold; }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(28, 28, 36, 0.95); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #2a2a35; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 10px; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
        .admin-badge { color: #ff4d4d; font-weight: bold; }
        input { width: 90%; padding: 10px; border-radius: 10px; border: 1px solid #333; background: #1c1c24; color: white; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="tab-mining" class="tab-content active">
        <h2 style="text-align:center;">CloudTone ☁️</h2>
        <div class="balance-card">
            <div><div style="color:var(--muted);font-size:14px;">Баланс</div><div class="balance-value"><span id="balance">0.0000</span> <span>TON CRY</span></div></div>
            <div><div style="color:var(--muted);font-size:14px;">Мощность</div><div class="balance-value"><span id="hashrate">0</span> <span>GH/s</span></div></div>
        </div>
        <div class="fan-container"><div class="fan inactive" id="fan"><svg viewBox="0 0 100 100"><path d="M50 10 A40 40 0 0 1 90 50 L50 50 Z"/><path d="M90 50 A40 40 0 0 1 50 90 L50 50 Z"/><path d="M50 90 A40 40 0 0 1 10 50 L50 50 Z"/><path d="M10 50 A40 40 0 0 1 50 10 L50 50 Z"/></svg></div></div>
        <div class="status-text" id="status-text">Майнинг не запущен</div>
        <div class="status-sub">Арендуйте сервер для старта</div>
        <button class="btn" onclick="claim()" id="claim-btn" style="display:none; background:var(--green);">Забрать награду</button>
    </div>

    <div id="tab-shop" class="tab-content">
        <h2>Магазин</h2>
        <div class="card"><div><h3>1 vCPU / 1 GB</h3><p style="color:var(--muted)">≈ 0.34 TON CRY/день</p></div><button class="btn" style="width:auto;margin:0;padding:10px;" onclick="buy(3, 0.34)">3 TON</button></div>
        <div class="card"><div><h3>4 vCPU / 8 GB</h3><p style="color:var(--muted)">≈ 1.7 TON CRY/день</p></div><button class="btn" style="width:auto;margin:0;padding:10px;" onclick="buy(12, 1.7)">12 TON</button></div>
        <h2 style="margin-top:30px;">Вывод</h2>
        <input type="text" id="wallet" placeholder="Ваш TON кошелек">
        <button class="btn" onclick="withdraw()" style="background:#e67e22;">Вывести</button>
    </div>

    <div id="tab-admin" class="tab-content">
        <h2 style="color:#ff4d4d;">👑 Админка</h2>
        <div id="stats" class="card">Загрузка...</div>
        <div id="withdraws"></div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('mining', this)"><svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2z"/></svg>Майнинг</button>
        <button class="nav-item" onclick="switchTab('shop', this)"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2z"/></svg>Магазин</button>
        <button class="nav-item admin-badge" id="admin-tab" style="display:none;" onclick="switchTab('admin', this)"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>Админ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
        const user = tg.initDataUnsafe?.user || {id: 123456789};
        const API = ""; 
        
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin_id') === user.id.toString()) {
            document.getElementById('admin-tab').style.display = 'flex';
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            btn.classList.add('active');
            if (tab === 'admin') loadAdmin();
        }

        async function fetchData() {
            const res = await fetch(API + '/api/user?id=' + user.id);
            const data = await res.json();
            document.getElementById('balance').innerText = data.balance.toFixed(4);
            document.getElementById('hashrate').innerText = data.hashrate;
            const fan = document.getElementById('fan');
            if (data.hashrate > 0) {
                fan.classList.remove('inactive');
                document.getElementById('status-text').innerText = "Майнинг активен";
                document.getElementById('claim-btn').style.display = 'block';
            }
        }

        async function claim() { await fetch(API + '/api/claim?id=' + user.id, {method: 'POST'}); fetchData(); tg.showAlert("Получено!"); }
        
        async function buy(price, income) {
            if (confirm(`Купить за ${price} TON? (Тест)`)) {
                await fetch(API + '/api/buy', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: user.id, income: income})});
                fetchData(); tg.showAlert("Куплено!");
            }
        }

        async function withdraw() {
            const w = document.getElementById('wallet').value;
            if (!w) return tg.showAlert("Введите кошелек!");
            const res = await fetch(API + '/api/withdraw', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: user.id, wallet: w})});
            const d = await res.json();
            tg.showAlert(d.msg || d.detail);
        }

        async function loadAdmin() {
            const res = await fetch(API + '/api/admin?admin_id=' + user.id);
            const data = await res.json();
            document.getElementById('stats').innerHTML = `<p>Юзеров: <b>${data.users}</b></p><p>Выплачено: <b>${data.paid} TON</b></p>`;
            const wDiv = document.getElementById('withdraws');
            wDiv.innerHTML = '';
            data.pending.forEach(w => {
                wDiv.innerHTML += `<div class="card"><div><p>ID: ${w.user_id}</p><p>${w.amount} TON</p></div><button class="btn" style="width:auto;margin:0;padding:10px;background:var(--green);" onclick="approve(${w.id})">Выплатить</button></div>`;
            });
        }

        async function approve(id) { await fetch(API + '/api/approve?id=' + id + '&admin_id=' + user.id, {method: 'POST'}); loadAdmin(); }

        fetchData();
    </script>
</body>
</html>
"""
